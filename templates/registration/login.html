{% extends "manager/base.html" %}
{% block auth %}<div class="login-wrap"><div class="card login-card"><div class="logo-mark">SS</div><h2>Sign in</h2><p class="muted">Stamp Stock Manager</p>{% if form.errors %}<div class="notice error">Username or password is incorrect.</div>{% endif %}<form method="post" class="form-grid">{% csrf_token %}{{ form.non_field_errors }}<label><span>Username</span>{{ form.username }}</label><label><span>Password</span>{{ form.password }}</label><input type="hidden" name="next" value="{{ next }}"><button type="submit">Sign in</button></form><p class="small">First run? Create the database and have an administrator set up your account.</p></div></div>{% endblock %}
